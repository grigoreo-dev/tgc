name: CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - name: shellcheck install.sh
        run: shellcheck install.sh
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
  conventional-commit-title:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'release-please[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Validate Conventional Commit title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(feat|fix|deps|docs|chore|test|refactor|perf|build|ci)(\([^)]+\))?!: .+|^(feat|fix|deps|docs|chore|test|refactor|perf|build|ci)(\([^)]+\))?: .+'
          if printf '%s' "$TITLE" | grep -Eq "$re"; then
            exit 0
          fi
          echo "error: PR title must be a Conventional Commit" >&2
          echo "got: ${TITLE}" >&2
          echo "expected: type(scope)!: subject" >&2
          echo "examples: feat: add feature | feat(cli): add flag | fix!: breaking fix | feat(api)!: break api" >&2
          echo "types: feat fix deps docs chore test refactor perf build ci" >&2
          exit 1

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing draft release tag to rebuild and publish (e.g. v1.2.3)
        required: true
        type: string

# Serialize rapid main pushes; never cancel an in-flight publish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-retry:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.validate.outputs.tag_name }}
    steps:
      - id: validate
        env:
          TAG: ${{ inputs.tag_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "tag_name must match ^v[0-9]+\.[0-9]+\.[0-9]+$" >&2
            exit 1
          fi
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"

  verify:
    needs: [validate-retry]
    if: |
      always() &&
      (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && needs.validate-retry.result == 'success')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          # Dispatch: validated tag only. Push: commit under test (main).
          ref: ${{ needs.validate-retry.outputs.tag_name || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - run: shellcheck install.sh

  release-please:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

  goreleaser:
    needs: [verify, validate-retry, release-please]
    if: |
      always() &&
      needs.verify.result == 'success' &&
      (
        (github.event_name == 'push' && needs.release-please.result == 'success' && needs.release-please.outputs.release_created == 'true') ||
        (github.event_name == 'workflow_dispatch' && needs.validate-retry.result == 'success')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.validate-retry.outputs.tag_name || needs.release-please.outputs.tag_name }}
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.validate-retry.outputs.tag_name || needs.release-please.outputs.tag_name }}
        run: gh release edit "$TAG_NAME" --draft=false
